<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Invest{% endblock %}</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/app.css?v=20260826-7">
    <script src="/static/vendor/lucide-0.468.0.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/strategy" aria-label="Invest 首页">
            <span class="brand-mark">I</span>
            <span>Invest</span>
        </a>
        <form id="global-market-search" class="global-search" role="search">
            <i data-lucide="search"></i>
            <select id="global-market-category" aria-label="搜索标的类型">
                <option value="">全部</option>
                <option value="stock">个股</option>
                <option value="etf">ETF</option>
                <option value="index">指数</option>
            </select>
            <input id="global-market-query" type="search" placeholder="搜索代码、名称或拼音" autocomplete="off" aria-label="搜索行情标的">
            <div id="global-market-results" class="global-search-results" hidden></div>
        </form>
        <nav class="nav-tabs" aria-label="主导航">
            <a href="/market" class="{% if active_page == 'market' %}active{% endif %}">
                <i data-lucide="chart-candlestick"></i><span>行情</span>
            </a>
            <a href="/strategy" class="{% if active_page == 'strategy' %}active{% endif %}">
                <i data-lucide="briefcase-business"></i><span>组合</span>
            </a>
            <a href="/analysis" class="{% if active_page == 'analysis' %}active{% endif %}">
                <i data-lucide="messages-square"></i><span>分析</span>
            </a>
            <a href="/information" class="{% if active_page == 'information' %}active{% endif %}">
                <i data-lucide="newspaper"></i><span>资讯</span>
            </a>
        </nav>
        <a class="icon-button" href="/docs" title="API 文档" aria-label="API 文档">
            <i data-lucide="file-json-2"></i>
        </a>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script>
        window.API_ROOT = "/api/v1";
        window.showToast = (message, kind = "info") => {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "toast visible " + kind;
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => toast.className = "toast", 3200);
        };
        window.api = async (path, options = {}) => {
            const response = await fetch(window.API_ROOT + path, {
                headers: {"Content-Type": "application/json", ...(options.headers || {})},
                ...options,
            });
            if (!response.ok) {
                let message = "请求失败";
                try { message = (await response.json()).detail || message; } catch (_) {}
                throw new Error(message);
            }
            return response.status === 204 ? null : response.json();
        };
        window.money = (value, currency = "CNY") =>
            new Intl.NumberFormat("zh-CN", {
                style: "currency", currency, maximumFractionDigits: 2,
            }).format(Number(value || 0));
        window.number = (value, digits = 2) =>
            new Intl.NumberFormat("zh-CN", {maximumFractionDigits: digits}).format(Number(value || 0));
        (() => {
            const form = document.getElementById("global-market-search");
            const input = document.getElementById("global-market-query");
            const category = document.getElementById("global-market-category");
            const results = document.getElementById("global-market-results");
            let timer = null;
            let assets = [];
            let activeIndex = -1;
            const categoryLabels = {stock: "个股", etf: "ETF", index: "指数"};

            const hideResults = () => {
                results.hidden = true;
                activeIndex = -1;
            };
            const openAsset = (asset) => {
                if (asset) location.href = "/market/" + encodeURIComponent(asset.category)
                    + "/" + encodeURIComponent(asset.symbol);
            };
            const renderResults = () => {
                results.replaceChildren();
                assets.forEach((asset, index) => {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "global-search-option";
                    button.dataset.index = index;
                    const identity = document.createElement("span");
                    const name = document.createElement("strong");
                    const symbol = document.createElement("small");
                    const metadata = document.createElement("span");
                    const type = document.createElement("span");
                    const currency = document.createElement("small");
                    name.textContent = asset.name;
                    symbol.textContent = asset.symbol;
                    metadata.className = "global-search-metadata";
                    type.className = "badge";
                    type.textContent = categoryLabels[asset.category] || asset.category;
                    currency.className = "global-search-currency";
                    currency.textContent = asset.currency;
                    identity.append(name, symbol);
                    metadata.append(type, currency);
                    button.append(identity, metadata);
                    button.addEventListener("mousedown", event => event.preventDefault());
                    button.addEventListener("click", () => openAsset(asset));
                    results.append(button);
                });
                results.hidden = !assets.length;
            };
            const search = async () => {
                const query = input.value.trim();
                if (!query) {
                    assets = [];
                    hideResults();
                    return;
                }
                try {
                    const params = new URLSearchParams({q: query, limit: "10"});
                    if (category.value) params.set("category", category.value);
                    assets = await api("/assets/search?" + params);
                    activeIndex = -1;
                    renderResults();
                } catch (error) {
                    hideResults();
                    showToast(error.message, "error");
                }
            };
            const setActive = (index) => {
                const options = [...results.querySelectorAll("button")];
                if (!options.length) return;
                activeIndex = (index + options.length) % options.length;
                options.forEach((option, optionIndex) =>
                    option.classList.toggle("active", optionIndex === activeIndex)
                );
                options[activeIndex].scrollIntoView({block: "nearest"});
            };

            input.addEventListener("input", () => {
                clearTimeout(timer);
                timer = setTimeout(search, 260);
            });
            category.addEventListener("change", () => {
                clearTimeout(timer);
                search();
            });
            input.addEventListener("focus", () => {
                if (assets.length) results.hidden = false;
            });
            input.addEventListener("keydown", event => {
                if (event.key === "ArrowDown") {
                    event.preventDefault();
                    setActive(activeIndex + 1);
                } else if (event.key === "ArrowUp") {
                    event.preventDefault();
                    setActive(activeIndex - 1);
                } else if (event.key === "Escape") {
                    hideResults();
                }
            });
            form.addEventListener("submit", event => {
                event.preventDefault();
                openAsset(assets[activeIndex >= 0 ? activeIndex : 0]);
            });
            document.addEventListener("click", event => {
                if (!form.contains(event.target)) hideResults();
            });
        })();
        document.addEventListener("DOMContentLoaded", () => window.lucide?.createIcons());
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
