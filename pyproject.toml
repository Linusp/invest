[project]
name = "invest-service"
version = "0.1.0"
description = "Independent market data and investment strategy service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "akshare>=1.18,<2",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "mcp>=1.13,<2",
  "pymysql>=1.1,<2",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "pypinyin>=0.55,<1",
  "rapidfuzz>=3.14,<4",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "codespell>=2.4",
  "ruff>=0.12",
]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
invest-api = "invest_service.main:run"
invest-mcp = "invest_service.mcp_server:run_stdio"
invest-worker = "invest_service.celery_app:run_worker"
invest-beat = "invest_service.celery_app:run_beat"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.codespell]
skip = ".git,.venv,*.egg-info,requirements.txt,*.min.js"
